function plot(series,sequence){

 svg+=`<text x="${L}" y="15" font-size="12" fill="#4c6476">耗时，微秒</text>`;
 for(let j=0;j<4;j++){
  const a=series[j],s=sets[j],c=s[3],st=a.statistics_us;
  if(sequence){
   const pts=a.samples_us.map((v,i)=>`${x(i)},${y(v)}`).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.4" opacity=".85"/>`;

   a.samples_us.forEach((v,i)=>svg+=`<circle cx="${xx+((i*13)%29-14)*1.45}" cy="${y(v)}" r="3" fill="${c}" opacity=".75"><title>${s[2]} 第${i+1}次：${v}微秒</title></circle>`);

   names.forEach((name,k)=>svg+=`<text x="${xx}" y="${H-B+24+k*15}" text-anchor="middle" font-size="12" fill="${c}">${name}</text>`);

}

 const n=Number(byId('case').value),row=data.comparisons.find(x=>x.N===n),series=sets.map(s=>data.timing.find(x=>x.N===n&&x.arm===s[0]&&x.variant===s[1]));
 byId('heading').textContent=`${n.toLocaleString()} 点，列长 ${row.C} × 行长 ${row.Q}`;
 byId('scatter').innerHTML=plot(series,false);byId('order').innerHTML=plot(series,true);
 byId('summary').innerHTML=table(['条件','中位数，微秒','中间50%区间','前后漂移提示'],series.map((x,i)=>[sets[i][2],fmt(x.statistics_us.median),fmt(x.statistics_us.p25)+'～'+fmt(x.statistics_us.p75),x.order_effect.flag?'有':'无']))+`<p>第六版相对EXP125：${row.current_vs_exp125.speedup.toFixed(4)}倍，${row.current_vs_exp125.assessment}。恢复相位顺序相对第六版：${row.phase_vs_current.speedup.toFixed(4)}倍，${row.phase_vs_current.assessment}。</p>`;
 const ts=['baseline','candidate'].map(arm=>data.traces.find(x=>x.N===n&&x.arm===arm));
 byId('stages').innerHTML=table(['条件','列端中位数，微秒','行端中位数，微秒','列／行最大驻留块数'],ts.map((x,i)=>[i?'第六版':'EXP125',fmt(x.kernels[0].statistics_us.median),fmt(x.kernels[1].statistics_us.median),x.maximum_active_workgroups.join('／')]));
}
byId('case').addEventListener('change',render);render();
</script></html>
